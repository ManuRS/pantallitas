<!doctype html>
<!-- Fuente de og.png (la imagen de previsualización en redes). Para regenerarla: node tools/og.js -->
<html lang="es"><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;font-family:Inter,system-ui,sans-serif;
    background:radial-gradient(circle at 215px 315px,#1b2a40 0,#121722 300px,#0f131a 700px);
    display:flex;align-items:center;gap:56px;padding:0 60px 0 72px;box-sizing:border-box}
  .logo{flex:none;width:300px;height:300px;filter:drop-shadow(0 0 40px rgba(77,163,255,.35))}
  .txt{min-width:0}
  h1{margin:0 0 22px;font-size:128px;line-height:1;font-weight:700;letter-spacing:-2.5px;color:#eef2f7}
  p{margin:0;font-size:52px;line-height:1.18;color:#9fb0c8;letter-spacing:-.3px}
  .accent{margin-top:28px;color:#4da3ff;font-weight:500}
</style></head>
<body>
  <img class="logo" src="../logo.svg" alt="">
  <div class="txt">
    <h1>Pantallitas</h1>
    <p>Todas las teles a la vez, sin pelearte con el mando</p>
    <p class="accent">Hasta 8 directos juntos</p>
  </div>
</body></html>
